name: crop_disease_detector
description: Offline crop disease detection using EfficientNetV2-S + GradCAM.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # ── TFLite inference ──────────────────────────────────────────────────── #
  tflite_flutter: ^0.10.4

  # ── image I/O & processing ────────────────────────────────────────────── #
  image_picker: ^1.0.7          # camera + gallery picker
  image: ^4.1.7                  # Dart image processing (resize, decode)
  path_provider: ^2.1.2          # temp dir for saving overlay
  flutter_image_compress: ^2.1.0 # JPEG compression for overlays

  # ── UI utilities ─────────────────────────────────────────────────────── #
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1            # Sora + JetBrains Mono
  flutter_animate: ^4.5.0         # stagger / fade animations
  lottie: ^3.1.0                  # loading animation (optional)
  percent_indicator: ^4.2.3       # confidence arc indicator
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0                 # skeleton loaders
  gap: ^3.0.1                     # SizedBox convenience

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/models/crop_model.tflite   # quantized EfficientNetV2-S
    - assets/models/labels.txt          # 38 class names, one per line
    - assets/images/leaf_placeholder.png

  fonts:
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-Regular.ttf
        - asset: assets/fonts/Sora-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Sora-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
